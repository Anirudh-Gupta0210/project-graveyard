<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Project Graveyard</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =============================
         LOGIN HEADER
    ============================== -->

    <header class="navbar">

        <div class="logo">
            ⚰️ Project Graveyard
        </div>

    </header>


    <!-- =============================
         AUTHENTICATION
    ============================== -->

    <main>

        <div class="auth-container">


            <!-- =============================
                 LOGIN CARD
            ============================== -->

            <div
                class="auth-card"
                id="loginCard"
            >

                <div class="auth-icon">
                    ⚰️
                </div>


                <h1>
                    Welcome Back
                </h1>


                <p class="auth-subtitle">
                    Login to Project Graveyard
                </p>


                <form id="loginForm">


                    <label for="loginEmail">
                        Email
                    </label>


                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="loginPassword">
                        Password
                    </label>


                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >


                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        🔐 Login
                    </button>


                </form>


                <!-- Signup Link -->

                <p class="auth-switch">

                    Don't have an account?

                    <a
                        href="#"
                        id="showSignup"
                    >
                        Sign Up
                    </a>

                </p>


            </div>


            <!-- =============================
                 SIGNUP CARD
            ============================== -->

            <div
                class="auth-card signup-card"
                id="signupCard"
            >

                <div class="auth-icon">
                    🧟
                </div>


                <h1>
                    Create Account
                </h1>


                <p class="auth-subtitle">
                    Join the Project Graveyard
                </p>


                <form id="signupForm">


                    <label for="signupName">
                        Name
                    </label>


                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required
                    >


                    <label for="signupEmail">
                        Email
                    </label>


                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="signupPassword">
                        Password
                    </label>


                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >


                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        🧟 Create Account
                    </button>


                </form>


                <!-- Login Link -->

                <p class="auth-switch">

                    Already have an account?

                    <a
                        href="#"
                        id="showLogin"
                    >
                        Login
                    </a>

                </p>


            </div>


        </div>

    </main>


    <!-- =============================
         FIREBASE AUTHENTICATION
    ============================== -->

    <script type="module">

        import { auth, db } from "./firebase.js";


        import {
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        import {
            doc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        // =============================
        // GET ELEMENTS
        // =============================

        const loginForm =
            document.getElementById("loginForm");


        const signupForm =
            document.getElementById("signupForm");


        const loginCard =
            document.getElementById("loginCard");


        const signupCard =
            document.getElementById("signupCard");


        const showSignup =
            document.getElementById("showSignup");


        const showLogin =
            document.getElementById("showLogin");


        // =============================
        // SWITCH TO SIGNUP
        // =============================

        showSignup.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                loginCard.style.display = "none";

                signupCard.style.display = "block";

            }
        );


        // =============================
        // SWITCH TO LOGIN
        // =============================

        showLogin.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                signupCard.style.display = "none";

                loginCard.style.display = "block";

            }
        );


        // =============================
        // EMAIL / PASSWORD SIGNUP
        // =============================

        signupForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document
                        .getElementById("signupName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("signupEmail")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("signupPassword")
                        .value;


                try {

                    // Create Firebase account

                    const userCredential =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    // Save display name

                    await updateProfile(
                        userCredential.user,
                        {
                            displayName: name
                        }
                    );


                    // Save user to Firestore

                    await setDoc(
                        doc(
                            db,
                            "users",
                            userCredential.user.uid
                        ),
                        {
                            name: name,
                            email: email,
                            createdAt: new Date()
                        }
                    );


                    alert(
                        "🎉 Account created successfully!"
                    );


                    window.location.href =
                        "index.html";


                } catch (error) {

                    console.error(
                        "Signup error:",
                        error
                    );


                    alert(
                        "❌ " + error.message
                    );

                }

            }
        );


        // =============================
        // EMAIL / PASSWORD LOGIN
        // =============================

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("loginPassword")
                        .value;


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    alert(
                        "👋 Login successful!"
                    );


                    window.location.href =
                        "index.html";


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    alert(
                        "❌ " + error.message
                    );

                }

            }
        );

    </script>


</body>

</html>
