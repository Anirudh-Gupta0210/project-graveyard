<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Project Graveyard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =============================
           PASSWORD FIELD
        ============================== */

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            width: 100%;
            box-sizing: border-box;
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: transparent;

            cursor: pointer;

            font-size: 18px;

            color: #777;

            padding: 4px;
        }

        .show-password:hover {
            color: #c51f3d;
        }


        /* =============================
           FORGOT PASSWORD
        ============================== */

        .forgot-password {
            display: block;

            text-align: right;

            margin-top: 10px;
            margin-bottom: 20px;

            color: #ff667c;

            text-decoration: none;

            font-weight: 600;

            cursor: pointer;
        }

        .forgot-password:hover {
            color: #ff8b9b;
            text-decoration: underline;
        }


        /* =============================
           STATUS MESSAGE
        ============================== */

        .auth-status {
            display: none;

            width: 100%;

            box-sizing: border-box;

            padding: 14px 16px;

            margin-bottom: 20px;

            border-radius: 12px;

            font-size: 14px;

            line-height: 1.5;

            font-weight: 600;
        }

        .auth-status.success {
            display: block;

            background: rgba(34, 197, 94, 0.10);

            border: 1px solid rgba(34, 197, 94, 0.30);

            color: #69e79a;
        }

        .auth-status.error {
            display: block;

            background: rgba(239, 68, 68, 0.10);

            border: 1px solid rgba(239, 68, 68, 0.30);

            color: #ff7777;
        }


        /* =============================
           LOADING BUTTON
        ============================== */

        .auth-btn.loading {
            opacity: 0.7;

            cursor: not-allowed;

            pointer-events: none;
        }

    </style>

</head>


<body>


    <!-- =============================
         LOGIN HEADER
    ============================== -->

    <header class="navbar">

        <div class="logo">
            ⚰️ Project Graveyard
        </div>

    </header>



    <!-- =============================
         AUTHENTICATION
    ============================== -->

    <main>

        <div class="auth-container">


            <!-- =============================
                 LOGIN CARD
            ============================== -->

            <div
                class="auth-card"
                id="loginCard"
            >

                <div class="auth-icon">
                    ⚰️
                </div>


                <h1>
                    Welcome Back
                </h1>


                <p class="auth-subtitle">
                    Login to Project Graveyard
                </p>


                <!-- LOGIN STATUS -->

                <div
                    id="loginStatus"
                    class="auth-status"
                ></div>


                <form id="loginForm">


                    <!-- EMAIL -->

                    <label for="loginEmail">
                        Email
                    </label>


                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >


                    <!-- PASSWORD -->

                    <label for="loginPassword">
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            id="toggleLoginPassword"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>


                    <!-- FORGOT PASSWORD -->

                    <a
                        href="#"
                        id="forgotPassword"
                        class="forgot-password"
                    >
                        Forgot Password?
                    </a>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="auth-btn"
                        id="loginSubmit"
                    >
                        🔐 Login
                    </button>

                </form>


                <!-- SIGNUP LINK -->

                <p class="auth-switch">

                    Don't have an account?

                    <a
                        href="#"
                        id="showSignup"
                    >
                        Sign Up
                    </a>

                </p>

            </div>



            <!-- =============================
                 SIGNUP CARD
            ============================== -->

            <div
                class="auth-card signup-card"
                id="signupCard"
            >

                <div class="auth-icon">
                    🧟
                </div>


                <h1>
                    Create Account
                </h1>


                <p class="auth-subtitle">
                    Join the Project Graveyard
                </p>


                <!-- SIGNUP STATUS -->

                <div
                    id="signupStatus"
                    class="auth-status"
                ></div>


                <form id="signupForm">


                    <!-- NAME -->

                    <label for="signupName">
                        Name
                    </label>


                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >


                    <!-- EMAIL -->

                    <label for="signupEmail">
                        Email
                    </label>


                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >


                    <!-- PASSWORD -->

                    <label for="signupPassword">
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            id="toggleSignupPassword"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>


                    <!-- SIGNUP BUTTON -->

                    <button
                        type="submit"
                        class="auth-btn"
                        id="signupSubmit"
                    >
                        🧟 Create Account
                    </button>

                </form>


                <!-- LOGIN LINK -->

                <p class="auth-switch">

                    Already have an account?

                    <a
                        href="#"
                        id="showLogin"
                    >
                        Login
                    </a>

                </p>

            </div>


        </div>

    </main>



    <!-- =============================
         FIREBASE AUTHENTICATION
    ============================== -->

    <script type="module">


        /* =============================
           FIREBASE IMPORTS
        ============================== */

        import {
            auth,
            db
        } from "./firebase.js";


        import {
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            updateProfile,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        import {
            doc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



        /* =============================
           GET ELEMENTS
        ============================== */

        const loginForm =
            document.getElementById("loginForm");


        const signupForm =
            document.getElementById("signupForm");


        const loginCard =
            document.getElementById("loginCard");


        const signupCard =
            document.getElementById("signupCard");


        const showSignup =
            document.getElementById("showSignup");


        const showLogin =
            document.getElementById("showLogin");


        const forgotPassword =
            document.getElementById("forgotPassword");


        const loginStatus =
            document.getElementById("loginStatus");


        const signupStatus =
            document.getElementById("signupStatus");


        const loginSubmit =
            document.getElementById("loginSubmit");


        const signupSubmit =
            document.getElementById("signupSubmit");


        const loginPassword =
            document.getElementById("loginPassword");


        const signupPassword =
            document.getElementById("signupPassword");


        const toggleLoginPassword =
            document.getElementById("toggleLoginPassword");


        const toggleSignupPassword =
            document.getElementById("toggleSignupPassword");



        /* =============================
           SHOW STATUS
        ============================== */

        function showStatus(
            element,
            message,
            type
        ) {

            element.textContent = message;

            element.className =
                "auth-status " + type;

        }



        /* =============================
           CLEAR STATUS
        ============================== */

        function clearStatus(element) {

            element.textContent = "";

            element.className =
                "auth-status";

        }



        /* =============================
           FRIENDLY FIREBASE ERRORS
        ============================== */

        function getFriendlyError(error) {

            switch (error.code) {

                case "auth/invalid-email":

                    return "Please enter a valid email address.";


                case "auth/invalid-credential":

                    return "Incorrect email or password.";


                case "auth/wrong-password":

                    return "Incorrect email or password.";


                case "auth/user-not-found":

                    return "No account exists with this email address.";


                case "auth/email-already-in-use":

                    return "An account already exists with this email.";


                case "auth/weak-password":

                    return "Password must contain at least 6 characters.";


                case "auth/too-many-requests":

                    return "Too many attempts. Please wait a little and try again.";


                case "auth/network-request-failed":

                    return "Network error. Please check your internet connection.";


                case "auth/missing-password":

                    return "Please enter your password.";


                default:

                    return error.message ||
                        "Something went wrong. Please try again.";

            }

        }



        /* =============================
           BUTTON LOADING
        ============================== */

        function setLoading(
            button,
            loading,
            normalText
        ) {

            if (loading) {

                button.disabled = true;

                button.classList.add("loading");

                button.textContent =
                    "⏳ Please wait...";

            } else {

                button.disabled = false;

                button.classList.remove("loading");

                button.textContent =
                    normalText;

            }

        }



        /* =============================
           SWITCH TO SIGNUP
        ============================== */

        showSignup.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                clearStatus(loginStatus);

                clearStatus(signupStatus);

                loginCard.style.display =
                    "none";

                signupCard.style.display =
                    "block";

            }
        );



        /* =============================
           SWITCH TO LOGIN
        ============================== */

        showLogin.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                clearStatus(loginStatus);

                clearStatus(signupStatus);

                signupCard.style.display =
                    "none";

                loginCard.style.display =
                    "block";

            }
        );



        /* =============================
           SHOW / HIDE LOGIN PASSWORD
        ============================== */

        toggleLoginPassword.addEventListener(
            "click",
            function () {

                if (
                    loginPassword.type ===
                    "password"
                ) {

                    loginPassword.type =
                        "text";

                    toggleLoginPassword.textContent =
                        "🙈";

                } else {

                    loginPassword.type =
                        "password";

                    toggleLoginPassword.textContent =
                        "👁";

                }

            }
        );



        /* =============================
           SHOW / HIDE SIGNUP PASSWORD
        ============================== */

        toggleSignupPassword.addEventListener(
            "click",
            function () {

                if (
                    signupPassword.type ===
                    "password"
                ) {

                    signupPassword.type =
                        "text";

                    toggleSignupPassword.textContent =
                        "🙈";

                } else {

                    signupPassword.type =
                        "password";

                    toggleSignupPassword.textContent =
                        "👁";

                }

            }
        );



        /* =============================
           FORGOT PASSWORD
        ============================== */

        forgotPassword.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();

                clearStatus(loginStatus);


                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();


                /* =============================
                   CHECK EMAIL
                ============================== */

                if (!email) {

                    showStatus(
                        loginStatus,
                        "📧 Enter your email address first.",
                        "error"
                    );

                    document
                        .getElementById("loginEmail")
                        .focus();

                    return;

                }


                /* =============================
                   SEND PASSWORD RESET EMAIL
                ============================== */

                try {

                    await sendPasswordResetEmail(
                        auth,
                        email
                    );


                    showStatus(
                        loginStatus,
                        "📩 Password reset email sent! Check your inbox, including Spam and Promotions.",
                        "success"
                    );

                }


                catch (error) {

                    console.error(
                        "Password reset error:",
                        error
                    );


                    showStatus(
                        loginStatus,
                        "❌ " +
                        getFriendlyError(error),
                        "error"
                    );

                }

            }
        );



        /* =============================
           EMAIL / PASSWORD SIGNUP
        ============================== */

        signupForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                clearStatus(signupStatus);


                const name =
                    document
                        .getElementById("signupName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("signupEmail")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("signupPassword")
                        .value;


                setLoading(
                    signupSubmit,
                    true,
                    "🧟 Create Account"
                );


                try {

                    const userCredential =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    await updateProfile(
                        userCredential.user,
                        {
                            displayName: name
                        }
                    );


                    await setDoc(
                        doc(
                            db,
                            "users",
                            userCredential.user.uid
                        ),
                        {
                            name: name,
                            email: email,
                            createdAt: new Date()
                        }
                    );


                    showStatus(
                        signupStatus,
                        "🎉 Account created successfully! Redirecting...",
                        "success"
                    );


                    setTimeout(
                        function () {

                            window.location.href =
                                "index.html";

                        },
                        1200
                    );

                }


                catch (error) {

                    console.error(
                        "Signup error:",
                        error
                    );


                    showStatus(
                        signupStatus,
                        "❌ " +
                        getFriendlyError(error),
                        "error"
                    );


                    setLoading(
                        signupSubmit,
                        false,
                        "🧟 Create Account"
                    );

                }

            }
        );



        /* =============================
           EMAIL / PASSWORD LOGIN
        ============================== */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                clearStatus(loginStatus);


                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("loginPassword")
                        .value;


                setLoading(
                    loginSubmit,
                    true,
                    "🔐 Login"
                );


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    showStatus(
                        loginStatus,
                        "👋 Login successful! Redirecting...",
                        "success"
                    );


                    setTimeout(
                        function () {

                            window.location.href =
                                "index.html";

                        },
                        800
                    );

                }


                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    showStatus(
                        loginStatus,
                        "❌ " +
                        getFriendlyError(error),
                        "error"
                    );


                    setLoading(
                        loginSubmit,
                        false,
                        "🔐 Login"
                    );

                }

            }
        );

    </script>


</body>

</html>
