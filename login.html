<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Project Graveyard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           SHOW / HIDE PASSWORD
        ===================================================== */

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 48px;
        }

        .show-password {
            position: absolute;
            top: 50%;
            right: 10px;

            transform: translateY(-50%);

            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            background: transparent;

            color: #9295a3;

            font-size: 16px;

            cursor: pointer;

            padding: 0;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .show-password:hover {
            color: #f87171;

            transform:
                translateY(-50%)
                scale(1.08);
        }

        .show-password:focus-visible {
            outline:
                2px solid #e05270;

            outline-offset:
                2px;

            border-radius:
                6px;
        }

    </style>

</head>



<body>


    <!-- =============================
         LOGIN HEADER
    ============================== -->

    <header class="navbar">

        <div class="logo">
            ⚰️ Project Graveyard
        </div>

    </header>



    <!-- =============================
         AUTHENTICATION
    ============================== -->

    <main>

        <div class="auth-container">


            <!-- =============================
                 LOGIN CARD
            ============================== -->

            <div
                class="auth-card"
                id="loginCard"
            >

                <div class="auth-icon">
                    ⚰️
                </div>


                <h1>
                    Welcome Back
                </h1>


                <p class="auth-subtitle">
                    Login to Project Graveyard
                </p>


                <form id="loginForm">


                    <label for="loginEmail">
                        Email
                    </label>


                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="loginPassword">
                        Password
                    </label>


                    <!-- PASSWORD FIELD -->

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            data-target="loginPassword"
                            aria-label="Show password"
                            title="Show password"
                        >
                            👁
                        </button>

                    </div>


                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        🔐 Login
                    </button>


                </form>


                <!-- Signup Link -->

                <p class="auth-switch">

                    Don't have an account?

                    <a
                        href="#"
                        id="showSignup"
                    >
                        Sign Up
                    </a>

                </p>


            </div>



            <!-- =============================
                 SIGNUP CARD
            ============================== -->

            <div
                class="auth-card signup-card"
                id="signupCard"
            >

                <div class="auth-icon">
                    🧟
                </div>


                <h1>
                    Create Account
                </h1>


                <p class="auth-subtitle">
                    Join the Project Graveyard
                </p>


                <form id="signupForm">


                    <label for="signupName">
                        Name
                    </label>


                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required
                    >


                    <label for="signupEmail">
                        Email
                    </label>


                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="signupPassword">
                        Password
                    </label>


                    <!-- PASSWORD FIELD -->

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            data-target="signupPassword"
                            aria-label="Show password"
                            title="Show password"
                        >
                            👁
                        </button>

                    </div>


                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        🧟 Create Account
                    </button>


                </form>


                <!-- Login Link -->

                <p class="auth-switch">

                    Already have an account?

                    <a
                        href="#"
                        id="showLogin"
                    >
                        Login
                    </a>

                </p>


            </div>


        </div>

    </main>



    <!-- =============================
         FIREBASE AUTHENTICATION
    ============================== -->

    <script type="module">

        import {
            auth,
            db
        } from "./firebase.js";


        import {
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        import {
            doc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        // =============================
        // GET ELEMENTS
        // =============================

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const signupForm =
            document.getElementById(
                "signupForm"
            );


        const loginCard =
            document.getElementById(
                "loginCard"
            );


        const signupCard =
            document.getElementById(
                "signupCard"
            );


        const showSignup =
            document.getElementById(
                "showSignup"
            );


        const showLogin =
            document.getElementById(
                "showLogin"
            );



        // =============================
        // SWITCH TO SIGNUP
        // =============================

        showSignup.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                loginCard.style.display =
                    "none";

                signupCard.style.display =
                    "block";

            }
        );



        // =============================
        // SWITCH TO LOGIN
        // =============================

        showLogin.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                signupCard.style.display =
                    "none";

                loginCard.style.display =
                    "block";

            }
        );



        // =============================
        // SHOW / HIDE PASSWORD
        // =============================

        document
            .querySelectorAll(
                ".show-password"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            const targetId =
                                this.dataset.target;


                            const passwordInput =
                                document.getElementById(
                                    targetId
                                );


                            if (!passwordInput) {
                                return;
                            }


                            // =========================
                            // SHOW PASSWORD
                            // =========================

                            if (
                                passwordInput.type ===
                                "password"
                            ) {

                                passwordInput.type =
                                    "text";


                                this.textContent =
                                    "🙈";


                                this.setAttribute(
                                    "aria-label",
                                    "Hide password"
                                );


                                this.setAttribute(
                                    "title",
                                    "Hide password"
                                );

                            }


                            // =========================
                            // HIDE PASSWORD
                            // =========================

                            else {

                                passwordInput.type =
                                    "password";


                                this.textContent =
                                    "👁";


                                this.setAttribute(
                                    "aria-label",
                                    "Show password"
                                );


                                this.setAttribute(
                                    "title",
                                    "Show password"
                                );

                            }

                        }
                    );

                }
            );



        // =============================
        // EMAIL / PASSWORD SIGNUP
        // =============================

        signupForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document
                        .getElementById(
                            "signupName"
                        )
                        .value
                        .trim();


                const email =
                    document
                        .getElementById(
                            "signupEmail"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "signupPassword"
                        )
                        .value;


                try {


                    // =============================
                    // CREATE FIREBASE ACCOUNT
                    // =============================

                    const userCredential =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    // =============================
                    // SAVE DISPLAY NAME
                    // =============================

                    await updateProfile(
                        userCredential.user,
                        {
                            displayName:
                                name
                        }
                    );


                    // =============================
                    // SAVE USER TO FIRESTORE
                    // =============================

                    await setDoc(
                        doc(
                            db,
                            "users",
                            userCredential.user.uid
                        ),
                        {
                            name:
                                name,

                            email:
                                email,

                            createdAt:
                                new Date()
                        }
                    );


                    alert(
                        "🎉 Account created successfully!"
                    );


                    window.location.href =
                        "index.html";


                }

                catch (error) {

                    console.error(
                        "Signup error:",
                        error
                    );


                    alert(
                        "❌ " +
                        error.message
                    );

                }

            }
        );



        // =============================
        // EMAIL / PASSWORD LOGIN
        // =============================

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById(
                            "loginEmail"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "loginPassword"
                        )
                        .value;


                try {


                    // =============================
                    // LOGIN
                    // =============================

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    alert(
                        "👋 Login successful!"
                    );


                    window.location.href =
                        "index.html";


                }

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    alert(
                        "❌ " +
                        error.message
                    );

                }

            }
        );

    </script>


</body>

</html>
