<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Project Graveyard</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .reset-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .reset-card {
            width: 100%;
            max-width: 520px;
            padding: 40px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(20, 22, 32, 0.95);
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        .reset-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .reset-card > p {
            text-align: center;
            color: #9ea3b1;
            margin-bottom: 30px;
        }

        .reset-field {
            margin-bottom: 20px;
        }

        .reset-field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .reset-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: #edf3ff;
            color: #111;
            font-size: 16px;
        }

        .reset-button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            background: #c51f3d;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .reset-button:hover {
            background: #df2949;
        }

        .reset-status {
            display: none;
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
        }

        .reset-status.success {
            display: block;
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #65e89a;
        }

        .reset-status.error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #ff7676;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #ff667c;
            text-decoration: none;
            font-weight: 600;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="reset-page">

    <div class="reset-card">

        <h1>🔐 Reset Password</h1>

        <p>Create a new password for your Project Graveyard account.</p>

        <form id="resetForm">

            <div class="reset-field">
                <label for="newPassword">New Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="toggleNewPassword"
                    >
                        👁
                    </button>

                </div>
            </div>


            <div class="reset-field">
                <label for="confirmPassword">Confirm Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="toggleConfirmPassword"
                    >
                        👁
                    </button>

                </div>
            </div>


            <button
                type="submit"
                class="reset-button"
                id="resetButton"
            >
                🔐 Reset Password
            </button>

        </form>

        <div id="resetStatus" class="reset-status"></div>

        <a href="login.html" class="back-login">
            ← Back to Login
        </a>

    </div>

</div>


<script type="module">

import { auth } from "./firebase.js";

import {
    verifyPasswordResetCode,
    confirmPasswordReset
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const params = new URLSearchParams(window.location.search);

const mode = params.get("mode");
const oobCode = params.get("oobCode");

const form = document.getElementById("resetForm");
const button = document.getElementById("resetButton");
const status = document.getElementById("resetStatus");

const newPassword = document.getElementById("newPassword");
const confirmPassword = document.getElementById("confirmPassword");


function showStatus(message, type) {

    status.textContent = message;

    status.className = "reset-status " + type;

}


function getFriendlyError(error) {

    switch (error.code) {

        case "auth/expired-action-code":
            return "This password reset link has expired. Please request a new one.";

        case "auth/invalid-action-code":
            return "This password reset link is invalid or has already been used.";

        case "auth/user-disabled":
            return "This account has been disabled.";

        case "auth/user-not-found":
            return "No account was found for this reset link.";

        case "auth/weak-password":
            return "Your password is too weak. Use at least 6 characters.";

        default:
            return error.message || "Something went wrong. Please try again.";

    }

}


// Make sure this is actually a password-reset link
if (mode !== "resetPassword" || !oobCode) {

    form.style.display = "none";

    showStatus(
        "❌ This is not a valid password reset link.",
        "error"
    );

} else {

    // Verify the reset code when the page opens
    try {

        await verifyPasswordResetCode(auth, oobCode);

    } catch (error) {

        form.style.display = "none";

        showStatus(
            "❌ " + getFriendlyError(error),
            "error"
        );

    }

}


// Show / hide new password
document.getElementById("toggleNewPassword").addEventListener("click", () => {

    if (newPassword.type === "password") {

        newPassword.type = "text";

    } else {

        newPassword.type = "password";

    }

});


// Show / hide confirm password
document.getElementById("toggleConfirmPassword").addEventListener("click", () => {

    if (confirmPassword.type === "password") {

        confirmPassword.type = "text";

    } else {

        confirmPassword.type = "password";

    }

});


// Reset password
form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const password = newPassword.value.trim();
    const confirm = confirmPassword.value.trim();


    if (password.length < 6) {

        showStatus(
            "❌ Password must contain at least 6 characters.",
            "error"
        );

        return;

    }


    if (password !== confirm) {

        showStatus(
            "❌ Passwords do not match.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent = "Resetting Password...";


    try {

        await confirmPasswordReset(
            auth,
            oobCode,
            password
        );


        showStatus(
            "✅ Password reset successfully! Redirecting to login...",
            "success"
        );


        form.reset();


        setTimeout(() => {

            window.location.href = "login.html";

        }, 2500);


    } catch (error) {

        showStatus(
            "❌ " + getFriendlyError(error),
            "error"
        );

        button.disabled = false;

        button.textContent = "🔐 Reset Password";

    }

});

</script>

</body>
</html>
