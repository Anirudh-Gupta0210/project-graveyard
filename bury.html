<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project Graveyard | Bury a Project</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =============================
         NAVIGATION
    ============================== -->

    <nav>

        <div class="logo">
            ⚰️ Project<span>Graveyard</span>
        </div>


        <div>

            <a href="index.html">
                Home
            </a>


            <a href="projects.html">
                Explore
            </a>


            <a href="bury.html">
                Bury a Project
            </a>


            <a href="requests.html">
                Requests
            </a>


            <a
                href="login.html"
                id="authLink"
            >
                Login
            </a>

        </div>

    </nav>



    <!-- =============================
         FORM HEADER
    ============================== -->

    <section class="bury-header">

        <div class="grave">
            ⚰️
        </div>


        <h1>
            Bury Your Project
        </h1>


        <p>

            Don't let your unfinished idea disappear.
            Give another developer the chance to bring it back to life.

        </p>

    </section>



    <!-- =============================
         PROJECT FORM
    ============================== -->

    <section class="bury-container">

        <form id="buryForm">


            <!-- Project Name -->

            <div class="form-group">

                <label for="projectName">
                    Project Name *
                </label>


                <input
                    type="text"
                    id="projectName"
                    placeholder="e.g. CampusConnect"
                    required
                >

            </div>



            <!-- Description -->

            <div class="form-group">

                <label for="description">
                    Project Description *
                </label>


                <textarea
                    id="description"
                    placeholder="Tell us what your project was supposed to do..."
                    required
                ></textarea>

            </div>



            <!-- GitHub -->

            <div class="form-group">

                <label for="github">
                    GitHub Repository
                </label>


                <input
                    type="url"
                    id="github"
                    placeholder="https://github.com/username/project"
                >


                <small>

                    Optional — sharing the repository helps others
                    understand and revive your project.

                </small>

            </div>



            <!-- Technology -->

            <div class="form-group">

                <label for="technology">
                    Technology / Tech Stack *
                </label>


                <input
                    type="text"
                    id="technology"
                    placeholder="e.g. React, Node.js, MongoDB"
                    required
                >

            </div>



            <!-- Category -->

            <div class="form-group">

                <label for="category">
                    Project Category *
                </label>


                <select
                    id="category"
                    required
                >

                    <option value="">
                        Select a category
                    </option>


                    <option value="web">
                        Web
                    </option>


                    <option value="ai">
                        AI / Machine Learning
                    </option>


                    <option value="mobile">
                        Mobile
                    </option>


                    <option value="other">
                        Other
                    </option>

                </select>

            </div>



            <!-- Cause -->

            <div class="form-group">

                <label for="cause">
                    Why was the project abandoned? *
                </label>


                <textarea
                    id="cause"
                    placeholder="e.g. Team graduated, lost interest, lack of time..."
                    required
                ></textarea>

            </div>



            <!-- Unfinished Features -->

            <div class="form-group">

                <label for="unfinished">
                    What's unfinished? *
                </label>


                <textarea
                    id="unfinished"
                    placeholder="List the features or parts that still need work..."
                    required
                ></textarea>

            </div>



            <!-- Difficulty -->

            <div class="form-group">

                <label for="difficulty">
                    Estimated Difficulty *
                </label>


                <select
                    id="difficulty"
                    required
                >

                    <option value="">
                        Select difficulty
                    </option>


                    <option value="easy">
                        ⭐⭐ Easy
                    </option>


                    <option value="medium">
                        ⭐⭐⭐ Medium
                    </option>


                    <option value="hard">
                        ⭐⭐⭐⭐ Hard
                    </option>

                </select>

            </div>



            <!-- Submit -->

            <button
                type="submit"
                class="bury-submit"
                id="burySubmit"
            >
                ☠️ Bury This Project
            </button>


        </form>

    </section>



    <!-- =============================
         FIREBASE
    ============================== -->

    <script type="module">

        import {
            auth,
            db
        } from "./firebase.js";


        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        import {
            collection,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        // =============================
        // GET ELEMENTS
        // =============================

        const form =
            document.getElementById("buryForm");


        const burySubmit =
            document.getElementById("burySubmit");


        const authLink =
            document.getElementById("authLink");


        let currentUser = null;



        // =============================
        // CHECK LOGIN STATUS
        // =============================

        onAuthStateChanged(
            auth,
            (user) => {

                if (!user) {

                    currentUser = null;


                    authLink.textContent =
                        "Login";


                    authLink.href =
                        "login.html";


                    alert(
                        "🔐 Please login before burying a project."
                    );


                    window.location.href =
                        "login.html";


                    return;

                }


                // =============================
                // USER IS LOGGED IN
                // =============================

                currentUser = user;


                authLink.textContent =
                    "👤 " +
                    (
                        user.displayName ||
                        "Account"
                    );


                authLink.href =
                    "account.html";

            }
        );



        // =============================
        // BURY PROJECT
        // =============================

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                // =============================
                // MAKE SURE USER IS LOGGED IN
                // =============================

                if (!currentUser) {

                    alert(
                        "🔐 Please login before burying a project."
                    );


                    window.location.href =
                        "login.html";


                    return;

                }



                try {

                    // Disable button while saving

                    burySubmit.disabled =
                        true;


                    burySubmit.textContent =
                        "⚰️ Burying Project...";



                    // =============================
                    // COLLECT PROJECT INFORMATION
                    // =============================

                    const project = {

                        // Project status

                        status:
                            "abandoned",



                        // Project name

                        name:
                            document
                                .getElementById(
                                    "projectName"
                                )
                                .value
                                .trim(),



                        // Description

                        description:
                            document
                                .getElementById(
                                    "description"
                                )
                                .value
                                .trim(),



                        // GitHub repository

                        github:
                            document
                                .getElementById(
                                    "github"
                                )
                                .value
                                .trim(),



                        // Technology

                        technology:
                            document
                                .getElementById(
                                    "technology"
                                )
                                .value
                                .trim(),



                        // Category

                        category:
                            document
                                .getElementById(
                                    "category"
                                )
                                .value,



                        // Cause of abandonment

                        cause:
                            document
                                .getElementById(
                                    "cause"
                                )
                                .value
                                .trim(),



                        // Unfinished features

                        unfinished:
                            document
                                .getElementById(
                                    "unfinished"
                                )
                                .value
                                .trim(),



                        // Difficulty

                        difficulty:
                            document
                                .getElementById(
                                    "difficulty"
                                )
                                .value,



                        // =============================
                        // PROJECT OWNER
                        // =============================

                        ownerId:
                            currentUser.uid,


                        ownerName:
                            currentUser.displayName ||
                            "Anonymous Developer",


                        ownerEmail:
                            currentUser.email ||
                            "",



                        // =============================
                        // CREATION TIME
                        // =============================

                        createdAt:
                            serverTimestamp()

                    };



                    // =============================
                    // SAVE TO FIRESTORE
                    // =============================

                    await addDoc(
                        collection(
                            db,
                            "projects"
                        ),
                        project
                    );



                    // =============================
                    // SUCCESS
                    // =============================

                    alert(
                        "☠️ Project buried successfully!"
                    );



                    // Go directly to Account

                    window.location.href =
                        "account.html";

                }


                catch (error) {

                    console.error(
                        "Error adding project:",
                        error
                    );


                    alert(
                        "❌ Something went wrong. Please try again."
                    );


                    // Re-enable button

                    burySubmit.disabled =
                        false;


                    burySubmit.textContent =
                        "☠️ Bury This Project";

                }

            }
        );

    </script>


</body>

</html>
