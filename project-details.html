<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project Details | Project Graveyard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =========================================================
           PROJECT DETAIL TAGS
        ========================================================= */

        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .detail-tag {
            display: inline-flex;
            align-items: center;
            padding: 7px 11px;
            border-radius: 999px;

            background:
                rgba(185, 28, 60, 0.08);

            border:
                1px solid rgba(185, 28, 60, 0.22);

            color: #f3a0ad;

            font-size: 11px;
            font-weight: 700;

            line-height: 1.2;
        }

        .detail-tag.type-tag {
            background:
                rgba(255, 255, 255, 0.045);

            border-color:
                rgba(255, 255, 255, 0.10);

            color: #d0d2da;
        }

        .detail-tags-empty {
            color: #858896;
            font-size: 12px;
        }


        /* =========================================================
           MOBILE TAGS
        ========================================================= */

        @media (max-width: 600px) {

            .detail-tags {
                gap: 6px;
            }

            .detail-tag {
                font-size: 10px;
                padding: 6px 9px;
            }

        }

    </style>

</head>



<body>


    <!-- =========================================================
         NAVIGATION
    ========================================================= -->

    <nav>

        <div class="logo">
            ⚰️ Project<span>Graveyard</span>
        </div>


        <div>

            <a href="index.html">
                Home
            </a>


            <a href="projects.html">
                Explore
            </a>


            <a href="bury.html">
                Bury a Project
            </a>


            <a href="requests.html">
                Requests
            </a>


            <a
                href="login.html"
                id="authLink"
            >
                Login
            </a>

        </div>

    </nav>



    <!-- =========================================================
         PROJECT DETAILS
    ========================================================= -->

    <main>

        <div class="details-page">


            <a
                href="projects.html"
                class="back-link"
            >
                ← Back to Graveyard
            </a>



            <div id="projectDetails">

                <div class="loading">
                    ⚰️ Digging up project details...
                </div>

            </div>

        </div>

    </main>



    <!-- =========================================================
         FIREBASE
    ========================================================= -->

    <script type="module">


        /* =========================================================
           IMPORT FIREBASE
        ========================================================= */

        import {
            auth,
            db
        } from "./firebase.js";


        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        import {
            doc,
            getDoc,
            collection,
            addDoc,
            updateDoc,
            serverTimestamp,
            query,
            where,
            getDocs
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



        /* =========================================================
           GET ELEMENTS
        ========================================================= */

        const projectDetails =
            document.getElementById(
                "projectDetails"
            );


        const authLink =
            document.getElementById(
                "authLink"
            );



        /* =========================================================
           GET PROJECT ID
        ========================================================= */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const projectId =
            urlParams.get("id");



        /* =========================================================
           CURRENT USER
        ========================================================= */

        let currentUser = null;



        /* =========================================================
           SECURITY HELPER
        ========================================================= */

        function escapeHTML(text) {

            return String(text)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        /* =========================================================
           TAG LABELS
        ========================================================= */

        const skillLabels = {

            frontend:
                "🖥️ Frontend",

            backend:
                "⚙️ Backend",

            "ai-ml":
                "🧠 AI / ML",

            "ui-ux":
                "🎨 UI / UX",

            database:
                "🗄️ Database",

            apis:
                "🔌 APIs",

            testing:
                "🧪 Testing",

            documentation:
                "📝 Documentation"

        };


        const projectTypeLabels = {

            "web-app":
                "🌐 Web App",

            "mobile-app":
                "📱 Mobile App",

            "ai-project":
                "🤖 AI Project",

            "data-project":
                "📊 Data Project",

            game:
                "🎮 Game",

            tool:
                "🔧 Tool",

            education:
                "🎓 Education",

            fintech:
                "💰 FinTech",

            agriculture:
                "🌱 Agriculture"

        };



        /* =========================================================
           AUTHENTICATION
        ========================================================= */

        onAuthStateChanged(
            auth,
            function(user) {

                currentUser =
                    user || null;


                if (user) {

                    authLink.textContent =
                        "👤 " +
                        (
                            user.displayName ||
                            "Account"
                        );


                    authLink.href =
                        "account.html";

                }

                else {

                    authLink.textContent =
                        "Login";


                    authLink.href =
                        "login.html";

                }

            }
        );



        /* =========================================================
           LOAD PROJECT
        ========================================================= */

        async function loadProject() {


            /* =====================================================
               CHECK PROJECT ID
            ===================================================== */

            if (!projectId) {

                projectDetails.innerHTML = `

                    <div class="error-box">

                        <div class="error-icon">
                            ☠️
                        </div>

                        <h1>
                            Project Not Found
                        </h1>

                        <p>
                            No project ID was provided.
                        </p>

                        <a href="projects.html">
                            Return to Graveyard
                        </a>

                    </div>

                `;

                return;

            }



            try {


                /* =================================================
                   GET PROJECT
                ================================================= */

                const projectRef =
                    doc(
                        db,
                        "projects",
                        projectId
                    );


                const projectSnap =
                    await getDoc(
                        projectRef
                    );



                /* =================================================
                   PROJECT DOES NOT EXIST
                ================================================= */

                if (
                    !projectSnap.exists()
                ) {

                    projectDetails.innerHTML = `

                        <div class="error-box">

                            <div class="error-icon">
                                ☠️
                            </div>

                            <h1>
                                Project Not Found
                            </h1>

                            <p>
                                This project may have been removed
                                from the graveyard.
                            </p>

                            <a href="projects.html">
                                ← Return to Graveyard
                            </a>

                        </div>

                    `;

                    return;

                }



                /* =================================================
                   PROJECT DATA
                ================================================= */

                const project =
                    projectSnap.data();



                /* =================================================
                   PROJECT STATUS
                ================================================= */

                const projectStatus =
                    project.status ||
                    "abandoned";


                let statusIcon =
                    "☠️";


                let statusText =
                    "ABANDONED";


                if (
                    projectStatus ===
                    "revival-requested"
                ) {

                    statusIcon =
                        "🧟";

                    statusText =
                        "REVIVAL REQUESTED";

                }


                if (
                    projectStatus ===
                    "in-progress"
                ) {

                    statusIcon =
                        "🔨";

                    statusText =
                        "IN PROGRESS";

                }


                if (
                    projectStatus ===
                    "revived"
                ) {

                    statusIcon =
                        "✨";

                    statusText =
                        "REVIVED";

                }



                /* =================================================
                   DIFFICULTY
                ================================================= */

                const difficulty =
                    project.difficulty ||
                    "easy";


                const stars =

                    difficulty === "easy"

                        ? "⭐"

                        : difficulty === "medium"

                            ? "⭐⭐"

                            : "⭐⭐⭐";



                /* =================================================
                   PROJECT HTML
                ================================================= */

                projectDetails.innerHTML = `


                    <!-- ==========================================
                         PROJECT HEADER
                    =========================================== -->

                    <div class="details-header">


                        <div class="grave-icon">
                            ⚰️
                        </div>



                        <span class="details-status">

                            ${statusIcon}

                            ${statusText}

                        </span>



                        <h1>

                            ${escapeHTML(
                                project.name ||
                                "Unnamed Project"
                            )}

                        </h1>



                        <p class="details-description">

                            ${escapeHTML(
                                project.description ||
                                "No description provided."
                            )}

                        </p>


                    </div>



                    <!-- ==========================================
                         DETAILS GRID
                    =========================================== -->

                    <div class="details-grid">


                        <!-- ======================================
                             TECHNOLOGY
                        ======================================= -->

                        <div class="detail-card">

                            <div class="detail-icon">
                                🛠️
                            </div>


                            <div>

                                <h2>
                                    Technology
                                </h2>


                                <p>

                                    ${escapeHTML(
                                        project.technology ||
                                        "Not specified"
                                    )}

                                </p>

                            </div>

                        </div>



                        <!-- ======================================
                             CAUSE
                        ======================================= -->

                        <div class="detail-card cause-card">

                            <div class="detail-icon">
                                💀
                            </div>


                            <div>

                                <h2>
                                    Cause of Abandonment
                                </h2>


                                <p>

                                    ${escapeHTML(
                                        project.cause ||
                                        "Unknown"
                                    )}

                                </p>

                            </div>

                        </div>



                        <!-- ======================================
                             UNFINISHED
                        ======================================= -->

                        <div class="detail-card unfinished-card">

                            <div class="detail-icon">
                                🚧
                            </div>


                            <div>

                                <h2>
                                    What's Unfinished?
                                </h2>


                                <p>

                                    ${escapeHTML(
                                        project.unfinished ||
                                        "Not specified"
                                    )}

                                </p>

                            </div>

                        </div>



                        <!-- ======================================
                             DIFFICULTY
                        ======================================= -->

                        <div class="detail-card difficulty-card">

                            <div class="detail-icon">
                                ⭐
                            </div>


                            <div>

                                <h2>
                                    Difficulty
                                </h2>


                                <p class="difficulty-stars">

                                    ${stars}

                                </p>


                                <span class="difficulty-label">

                                    ${escapeHTML(
                                        difficulty.toUpperCase()
                                    )}

                                </span>

                            </div>

                        </div>



                        <!-- ======================================
                             SKILLS NEEDED
                        ======================================= -->

                        <div class="detail-card">

                            <div class="detail-icon">
                                🧠
                            </div>


                            <div>

                                <h2>
                                    Skills Needed
                                </h2>


                                <div
                                    id="projectSkills"
                                    class="detail-tags"
                                >
                                </div>

                            </div>

                        </div>



                        <!-- ======================================
                             PROJECT TYPE
                        ======================================= -->

                        <div class="detail-card">

                            <div class="detail-icon">
                                📦
                            </div>


                            <div>

                                <h2>
                                    Project Type
                                </h2>


                                <div
                                    id="projectTypes"
                                    class="detail-tags"
                                >
                                </div>

                            </div>

                        </div>


                    </div>



                    <!-- ==========================================
                         PROJECT OWNER
                    =========================================== -->

                    <div
                        class="detail-card"
                        style="
                            margin-top: 20px;
                        "
                    >

                        <div class="detail-icon">
                            👤
                        </div>


                        <div>

                            <h2>
                                Project Owner
                            </h2>


                            <p>

                                ${escapeHTML(
                                    project.ownerName ||
                                    "Anonymous Developer"
                                )}

                            </p>

                        </div>

                    </div>



                    <!-- ==========================================
                         ACTIONS
                    =========================================== -->

                    <div class="details-actions">


                        ${
                            project.github
                                ? `

                                    <a
                                        href="${escapeHTML(
                                            project.github
                                        )}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        class="github-btn"
                                    >

                                        💻 View GitHub

                                    </a>

                                `
                                : ""
                        }



                        <button
                            class="revive-btn"
                            id="reviveButton"
                        >

                            🧟 Revive This Project

                        </button>



                        <button
                            class="revived-btn"
                            id="revivedButton"
                        >

                            ✨ Mark as Revived

                        </button>


                    </div>



                    <!-- ==========================================
                         AI AUTOPSY
                    =========================================== -->

                    <div class="autopsy-preview">


                        <div class="autopsy-icon">
                            🤖
                        </div>


                        <div>

                            <span class="coming-soon">
                                COMING SOON
                            </span>


                            <h2>
                                🔬 AI Project Autopsy
                            </h2>


                            <p>

                                Let AI analyze this abandoned project,
                                identify what's missing, estimate
                                completion difficulty, and suggest
                                how to bring it back to life.

                            </p>

                        </div>

                    </div>


                `;



                /* =================================================
                   DISPLAY SKILLS
                ================================================= */

                const skillsContainer =
                    document.getElementById(
                        "projectSkills"
                    );


                const typesContainer =
                    document.getElementById(
                        "projectTypes"
                    );



                /* =================================================
                   SKILLS
                ================================================= */

                if (
                    skillsContainer &&
                    Array.isArray(project.skills) &&
                    project.skills.length > 0
                ) {

                    skillsContainer.innerHTML =

                        project.skills
                            .map(
                                function(skill) {

                                    const key =
                                        String(
                                            skill
                                        )
                                            .trim()
                                            .toLowerCase();


                                    return `

                                        <span
                                            class="detail-tag"
                                        >

                                            ${
                                                skillLabels[key] ||
                                                "🏷️ " +
                                                escapeHTML(
                                                    skill
                                                )
                                            }

                                        </span>

                                    `;

                                }
                            )
                            .join("");

                }

                else if (
                    skillsContainer
                ) {

                    skillsContainer.innerHTML = `

                        <span class="detail-tags-empty">

                            Not specified

                        </span>

                    `;

                }



                /* =================================================
                   PROJECT TYPES
                ================================================= */

                if (
                    typesContainer &&
                    Array.isArray(project.projectTypes) &&
                    project.projectTypes.length > 0
                ) {

                    typesContainer.innerHTML =

                        project.projectTypes
                            .map(
                                function(type) {

                                    const key =
                                        String(
                                            type
                                        )
                                            .trim()
                                            .toLowerCase();


                                    return `

                                        <span
                                            class="detail-tag type-tag"
                                        >

                                            ${
                                                projectTypeLabels[key] ||
                                                "🏷️ " +
                                                escapeHTML(
                                                    type
                                                )
                                            }

                                        </span>

                                    `;

                                }
                            )
                            .join("");

                }

                else if (
                    typesContainer
                ) {

                    typesContainer.innerHTML = `

                        <span class="detail-tags-empty">

                            Not specified

                        </span>

                    `;

                }



                /* =================================================
                   GET BUTTONS
                ================================================= */

                const reviveButton =
                    document.getElementById(
                        "reviveButton"
                    );


                const revivedButton =
                    document.getElementById(
                        "revivedButton"
                    );



                /* =================================================
                   REVIVE BUTTON STATE
                ================================================= */

                if (
                    projectStatus !==
                    "abandoned"
                ) {

                    reviveButton.disabled =
                        true;


                    if (
                        projectStatus ===
                        "revival-requested"
                    ) {

                        reviveButton.textContent =
                            "⏳ Revival Request Pending";

                    }


                    if (
                        projectStatus ===
                        "in-progress"
                    ) {

                        reviveButton.textContent =
                            "🔨 Project In Progress";

                    }


                    if (
                        projectStatus ===
                        "revived"
                    ) {

                        reviveButton.textContent =
                            "✨ Project Revived";

                    }

                }



                /* =================================================
                   MARK AS REVIVED BUTTON
                ================================================= */

                if (
                    projectStatus !==
                    "in-progress"
                ) {

                    revivedButton.disabled =
                        true;

                }



                /* =================================================
                   REVIVE PROJECT
                ================================================= */

                reviveButton.addEventListener(
                    "click",
                    async function() {


                        /* =========================================
                           LOGIN CHECK
                        ========================================== */

                        if (!currentUser) {

                            alert(
                                "🔐 Please login before requesting a revival."
                            );


                            window.location.href =
                                "login.html";


                            return;

                        }



                        /* =========================================
                           OWNER CHECK
                        ========================================== */

                        if (
                            project.ownerId &&
                            project.ownerId ===
                            currentUser.uid
                        ) {

                            alert(
                                "⚠️ You cannot request a revival for your own project."
                            );


                            return;

                        }



                        try {


                            reviveButton.disabled =
                                true;


                            reviveButton.textContent =
                                "🧟 Sending Request...";



                            /* =====================================
                               CHECK EXISTING REQUEST
                            ====================================== */

                            const requestsQuery =
                                query(
                                    collection(
                                        db,
                                        "revivalRequests"
                                    ),
                                    where(
                                        "projectId",
                                        "==",
                                        projectId
                                    ),
                                    where(
                                        "requesterId",
                                        "==",
                                        currentUser.uid
                                    )
                                );


                            const existingRequests =
                                await getDocs(
                                    requestsQuery
                                );



                            if (
                                !existingRequests.empty
                            ) {

                                alert(
                                    "⏳ You have already requested to revive this project."
                                );


                                reviveButton.disabled =
                                    false;


                                reviveButton.textContent =
                                    "🧟 Revive This Project";


                                return;

                            }



                            /* =====================================
                               CREATE REVIVAL REQUEST
                            ====================================== */

                            await addDoc(
                                collection(
                                    db,
                                    "revivalRequests"
                                ),
                                {

                                    projectName:
                                        project.name ||
                                        "Unnamed Project",

                                    projectId:
                                        projectId,

                                    requesterId:
                                        currentUser.uid,

                                    requesterName:
                                        currentUser.displayName ||
                                        "Anonymous Developer",

                                    requesterEmail:
                                        currentUser.email ||
                                        "",

                                    status:
                                        "pending",

                                    requestedAt:
                                        serverTimestamp()

                                }
                            );



                            /* =====================================
                               UPDATE PROJECT STATUS
                            ====================================== */

                            await updateDoc(
                                doc(
                                    db,
                                    "projects",
                                    projectId
                                ),
                                {

                                    status:
                                        "revival-requested"

                                }
                            );



                            /* =====================================
                               SUCCESS
                            ====================================== */

                            alert(
                                "🧟 Revival Request Sent!\n\n" +
                                "The project owner can now review your request."
                            );


                            window.location.reload();

                        }


                        catch (error) {

                            console.error(
                                "Error creating revival request:",
                                error
                            );


                            alert(
                                "❌ Something went wrong. Please try again."
                            );


                            reviveButton.disabled =
                                false;


                            reviveButton.textContent =
                                "🧟 Revive This Project";

                        }

                    }
                );



                /* =================================================
                   MARK AS REVIVED
                ================================================= */

                revivedButton.addEventListener(
                    "click",
                    async function() {


                        /* =========================================
                           LOGIN CHECK
                        ========================================== */

                        if (!currentUser) {

                            alert(
                                "🔐 Please login before changing project status."
                            );


                            window.location.href =
                                "login.html";


                            return;

                        }



                        /* =========================================
                           OWNER CHECK
                        ========================================== */

                        if (
                            project.ownerId &&
                            project.ownerId !==
                            currentUser.uid
                        ) {

                            alert(
                                "🔐 Only the project owner can mark this project as revived."
                            );


                            return;

                        }



                        try {


                            revivedButton.disabled =
                                true;


                            revivedButton.textContent =
                                "✨ Reviving...";



                            /* =====================================
                               UPDATE PROJECT
                            ====================================== */

                            await updateDoc(
                                doc(
                                    db,
                                    "projects",
                                    projectId
                                ),
                                {

                                    status:
                                        "revived"

                                }
                            );



                            /* =====================================
                               SUCCESS
                            ====================================== */

                            alert(
                                "✨ Project Revived!\n\n" +
                                "This project has officially been brought back to life!"
                            );


                            window.location.reload();

                        }


                        catch (error) {

                            console.error(
                                "Error marking project as revived:",
                                error
                            );


                            alert(
                                "❌ Something went wrong. Please try again."
                            );


                            revivedButton.disabled =
                                false;


                            revivedButton.textContent =
                                "✨ Mark as Revived";

                        }

                    }
                );

            }



            catch (error) {

                console.error(
                    "Error loading project:",
                    error
                );


                projectDetails.innerHTML = `

                    <div class="error-box">

                        <div class="error-icon">
                            ⚠️
                        </div>


                        <h1>
                            Unable to Load Project
                        </h1>


                        <p>

                            Something went wrong while retrieving
                            this project.

                        </p>


                        <a href="projects.html">

                            ← Back to Graveyard

                        </a>

                    </div>

                `;

            }

        }



        /* =========================================================
           START
        ========================================================= */

        loadProject();

    </script>


</body>

</html>
