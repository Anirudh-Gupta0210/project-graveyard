<html lang="en">

<head>

    <meta charset="UTF-8">

    <style>

        /* =============================
           SORTING
        ============================== */

        .project-sort {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .project-sort label {
            color: #b8b8c7;
            font-size: 14px;
        }

        .project-sort select {
            background: #17131f;
            color: #ffffff;
            border: 1px solid #3b3150;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .project-sort select:focus {
            border-color: #8b5cf6;
        }


        /* =============================
           REVIVAL POTENTIAL
        ============================== */

        .revival-score {
            display: inline-block;
            margin: 12px 0 4px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(139, 92, 246, 0.12);
            color: #c4b5fd;
            font-size: 12px;
            font-weight: 700;
        }


        /* =============================
           SAVE BUTTON
        ============================== */

        .save-btn {
            border: 1px solid rgba(139, 92, 246, 0.25);
            background: rgba(139, 92, 246, 0.08);
            color: #c4b5fd;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .save-btn:hover {
            background: rgba(139, 92, 246, 0.16);
            border-color: rgba(139, 92, 246, 0.5);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .save-btn.saved {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.4);
            color: #86efac;
        }

        .save-btn.saved:hover {
            background: rgba(34, 197, 94, 0.18);
            border-color: rgba(34, 197, 94, 0.6);
            color: #bbf7d0;
        }


        /* =============================
           QUICK SEARCH
        ============================== */

        #quickSearch {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        .quick-search-label {
            color: #a9a7b2;
            font-size: 13px;
            margin-right: 4px;
        }

        #quickSearch button {
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.035);
            color: #b9b7c2;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        #quickSearch button:hover {
            background: rgba(190,30,60,0.12);
            border-color: rgba(220,55,80,0.45);
            color: #f2a1ad;
            transform: translateY(-1px);
        }

        #quickSearch button.active {
            background: rgba(190,30,60,0.18);
            border-color: #c51f43;
            color: #f3a1ad;
        }


        /* =============================
           PROJECT TAGS
        ============================== */

        .project-tag-groups {
            margin-bottom: 18px;
        }

        .project-tag-group {
            margin-bottom: 10px;
        }

        .project-tag-group:last-child {
            margin-bottom: 0;
        }

        .project-tag-label {
            display: block;
            margin-bottom: 7px;
            color: #777a87;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .project-tag {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.09);
            background: rgba(255, 255, 255, 0.04);
            color: #cfd1da;
            padding: 6px 10px;
            border-radius: 999px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.1;
            cursor: pointer;
            transition:
                background 0.18s ease,
                border-color 0.18s ease,
                color 0.18s ease,
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        .project-tag:hover {
            background: rgba(185, 28, 60, 0.14);
            border-color: rgba(197, 31, 67, 0.55);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(185, 28, 60, 0.10);
        }

        .project-tag.skill-tag {
            background: rgba(185, 28, 60, 0.055);
            border-color: rgba(185, 28, 60, 0.20);
            color: #f3a0ad;
        }

        .project-tag.type-tag {
            background: rgba(255, 255, 255, 0.04);
        }


        /* =============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            .project-sort {
                justify-content: flex-start;
            }

            .project-sort select {
                width: 100%;
            }

            #quickSearch {
                gap: 6px;
            }

            .quick-search-label {
                width: 100%;
                margin-bottom: 2px;
            }

            #quickSearch button {
                font-size: 11px;
                padding: 7px 10px;
            }

            .project-tag {
                font-size: 10px;
                padding: 6px 9px;
            }

        }

    </style>

</head>

    <!-- =============================
         PROJECTS
    ============================== -->

    <main
        class="project-grid"
        id="projectGrid"
    >

        <!-- Projects will be loaded from Firebase -->

    <!-- =============================
         MAIN JAVASCRIPT
    ============================== -->

    <script
        type="module"
        src="script.js"
    ></script>


    <!-- =============================
         FIREBASE PROJECTS
    ============================== -->

    <script type="module">

        import {
            db,
            auth
        } from "./firebase.js";


        import {
            collection,
            getDocs,
            addDoc,
            deleteDoc,
            doc,
            query,
            where,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        const projectGrid =
            document.getElementById(
                "projectGrid"
            );


        const sortSelect =
            document.getElementById(
                "sortSelect"
            );


        // =============================
        // CURRENT USER
        // =============================

        let currentUser = null;

        let savedProjectIds =
            new Set();


        // =============================
        // LOAD SAVED PROJECTS
        // =============================

        async function loadSavedProjects() {

            savedProjectIds =
                new Set();

            if (!currentUser) {
                return;
            }

            try {

                const savedQuery =
                    query(
                        collection(
                            db,
                            "savedProjects"
                        ),
                        where(
                            "userId",
                            "==",
                            currentUser.uid
                        )
                    );


                const snapshot =
                    await getDocs(
                        savedQuery
                    );


                snapshot.forEach(
                    function(savedDoc) {

                        const saved =
                            savedDoc.data();


                        if (saved.projectId) {

                            savedProjectIds.add(
                                saved.projectId
                            );

                        }

                    }
                );

            }

            catch (error) {

                console.error(
                    "Error loading saved projects:",
                    error
                );

            }

        }


        // =============================
        // SAVE PROJECT
        // =============================

        async function toggleSaveProject(
            projectId,
            projectName,
            button
        ) {

            if (!currentUser) {

                alert(
                    "🔐 Please log in to save projects."
                );

                window.location.href =
                    "login.html";

                return;

            }


            try {

                // =============================
                // UNSAVE
                // =============================

                if (
                    savedProjectIds.has(
                        projectId
                    )
                ) {

                    const savedQuery =
                        query(
                            collection(
                                db,
                                "savedProjects"
                            ),
                            where(
                                "userId",
                                "==",
                                currentUser.uid
                            ),
                            where(
                                "projectId",
                                "==",
                                projectId
                            )
                        );


                    const snapshot =
                        await getDocs(
                            savedQuery
                        );


                    for (
                        const savedDoc of snapshot.docs
                    ) {

                        await deleteDoc(
                            doc(
                                db,
                                "savedProjects",
                                savedDoc.id
                            )
                        );

                    }


                    savedProjectIds.delete(
                        projectId
                    );


                    button.classList.remove(
                        "saved"
                    );


                    button.textContent =
                        "🔖 Save";


                    button.title =
                        "Save Project";


                    return;

                }


                // =============================
                // SAVE
                // =============================

                await addDoc(
                    collection(
                        db,
                        "savedProjects"
                    ),
                    {

                        userId:
                            currentUser.uid,

                        projectId:
                            projectId,

                        projectName:
                            projectName,

                        savedAt:
                            serverTimestamp()

                    }
                );


                savedProjectIds.add(
                    projectId
                );


                button.classList.add(
                    "saved"
                );


                button.textContent =
                    "✅ Saved";


                button.title =
                    "Remove from saved projects";

            }


            catch (error) {

                console.error(
                    "Error saving project:",
                    error
                );


                alert(
                    "❌ Could not save the project.\n\nPlease try again."
                );

            }

        }


        // =============================
        // PROJECT TAG LABELS
        // =============================

        const skillLabels = {

            "frontend":
                "🖥️ Frontend",

            "backend":
                "⚙️ Backend",

            "ai-ml":
                "🧠 AI / ML",

            "ui-ux":
                "🎨 UI / UX",

            "database":
                "🗄️ Database",

            "apis":
                "🔌 APIs",

            "testing":
                "🧪 Testing",

            "documentation":
                "📝 Documentation"

        };


        const projectTypeLabels = {

            "web-app":
                "🌐 Web App",

            "mobile-app":
                "📱 Mobile App",

            "ai-project":
                "🤖 AI Project",

            "data-project":
                "📊 Data Project",

            "game":
                "🎮 Game",

            "tool":
                "🔧 Tool",

            "education":
                "🎓 Education",

            "fintech":
                "💰 FinTech",

            "agriculture":
                "🌱 Agriculture"

        };


        function prettyTag(value) {

            return String(
                value || ""
            )
                .replaceAll(
                    "-",
                    " "
                )
                .replace(
                    /\b\w/g,
                    function(letter) {

                        return letter.toUpperCase();

                    }
                );

        }


        // =============================
        // TAG CLICK
        // =============================

        function addTagFilter(
            button
        ) {

            button.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    event.stopPropagation();


                    const searchInput =
                        document.getElementById(
                            "searchInput"
                        );


                    if (!searchInput) {
                        return;
                    }


                    searchInput.value =
                        this.dataset.searchTag ||
                        this.textContent.trim();


                    searchInput.dispatchEvent(
                        new Event(
                            "input",
                            {
                                bubbles: true
                            }
                        )
                    );


                    searchInput.focus();

                }
            );

        }


        // =============================
        // RENDER TAGS
        // =============================

        function renderProjectTags(
            container,
            skills,
            projectTypes
        ) {

            if (!container) {
                return;
            }


            const safeSkills =
                Array.isArray(skills)
                    ? skills.filter(Boolean)
                    : [];


            const safeTypes =
                Array.isArray(projectTypes)
                    ? projectTypes.filter(Boolean)
                    : [];


            function createGroup(
                title,
                values,
                labels,
                className
            ) {

                if (
                    values.length === 0
                ) {

                    return;

                }


                const group =
                    document.createElement(
                        "div"
                    );


                group.className =
                    "project-tag-group";


                const label =
                    document.createElement(
                        "span"
                    );


                label.className =
                    "project-tag-label";


                label.textContent =
                    title;


                const tags =
                    document.createElement(
                        "div"
                    );


                tags.className =
                    "project-tags";


                values.forEach(
                    function(value) {

                        const key =
                            String(
                                value
                            )
                                .trim()
                                .toLowerCase();


                        const button =
                            document.createElement(
                                "button"
                            );


                        button.type =
                            "button";


                        button.className =
                            "project-tag " +
                            className;


                        button.textContent =
                            labels[key] ||
                            (
                                "🏷️ " +
                                prettyTag(
                                    value
                                )
                            );


                        button.dataset.searchTag =
                            prettyTag(
                                value
                            );


                        button.title =
                            "Show projects tagged " +
                            prettyTag(
                                value
                            );


                        addTagFilter(
                            button
                        );


                        tags.appendChild(
                            button
                        );

                    }
                );


                group.appendChild(
                    label
                );


                group.appendChild(
                    tags
                );


                container.appendChild(
                    group
                );

            }


            createGroup(
                "Skills",
                safeSkills,
                skillLabels,
                "skill-tag"
            );


            createGroup(
                "Project Type",
                safeTypes,
                projectTypeLabels,
                "type-tag"
            );

        }


        // =============================
        // LOAD PROJECTS
        // =============================

        async function loadProjects() {

            try {

                await loadSavedProjects();


                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "projects"
                        )
                    );


                if (snapshot.empty) {

                    projectGrid.innerHTML = `

                        <div class="no-projects">

                            <h2>
                                💀 The Graveyard is Empty
                            </h2>

                            <p>
                                No abandoned projects have been buried yet.
                            </p>

                            <a href="bury.html">
                                Bury the First Project
                            </a>

                        </div>

                    `;

                    return;

                }


                snapshot.forEach(
                    function(projectDoc) {

                        const project =
                            projectDoc.data();


                        // =============================
                        // PROJECT STATUS
                        // =============================

                        const projectStatus =
                            project.status ||
                            "abandoned";


                        let statusText =
                            projectStatus
                                .replaceAll(
                                    "-",
                                    " "
                                )
                                .toUpperCase();


                        // =============================
                        // STATUS ICON
                        // =============================

                        let statusIcon =
                            "☠️";


                        if (
                            projectStatus ===
                            "revival-requested"
                        ) {

                            statusIcon =
                                "🧟";

                        }


                        if (
                            projectStatus ===
                            "in-progress"
                        ) {

                            statusIcon =
                                "🔨";

                        }


                        if (
                            projectStatus ===
                            "revived"
                        ) {

                            statusIcon =
                                "✨";

                        }


                        // =============================
                        // CREATE CARD
                        // =============================

                        const card =
                            document.createElement(
                                "article"
                            );


                        card.className =
                            "project-card";


                        card.dataset.category =
                            project.category ||
                            "other";


                        card.dataset.status =
                            projectStatus;


                        // =============================
                        // REVIVAL POTENTIAL
                        // =============================

                        let revivalScore =
                            50;


                        if (
                            project.difficulty ===
                            "easy"
                        ) {

                            revivalScore +=
                                20;

                        }

                        else if (
                            project.difficulty ===
                            "medium"
                        ) {

                            revivalScore +=
                                10;

                        }


                        if (
                            project.description
                        ) {

                            if (
                                project.description.length >=
                                100
                            ) {

                                revivalScore +=
                                    10;

                            }

                            else {

                                revivalScore +=
                                    5;

                            }

                        }


                        if (
                            project.technology
                        ) {

                            revivalScore +=
                                5;

                        }


                        if (
                            project.github
                        ) {

                            revivalScore +=
                                10;

                        }


                        if (
                            project.unfinished
                        ) {

                            revivalScore +=
                                5;

                        }


                        revivalScore =
                            Math.min(
                                revivalScore,
                                100
                            );


                        // =============================
                        // CREATED TIME
                        // =============================

                        let createdTime =
                            0;


                        if (
                            project.createdAt
                        ) {

                            if (
                                typeof
                                project.createdAt.toMillis ===
                                "function"
                            ) {

                                createdTime =
                                    project.createdAt.toMillis();

                            }

                            else if (
                                project.createdAt.seconds
                            ) {

                                createdTime =
                                    project.createdAt.seconds *
                                    1000;

                            }

                        }


                        card.dataset.revivalScore =
                            revivalScore;


                        card.dataset.createdTime =
                            createdTime;


                        // =============================
                        // REVIVE BUTTON
                        // =============================

                        let reviveButton =
                            "";


                        if (
                            projectStatus ===
                            "abandoned"
                        ) {

                            reviveButton = `

                                <button
                                    class="revive-btn"
                                    onclick="
                                        reviveProject(
                                            '${escapeJS(projectDoc.id)}',
                                            '${escapeJS(
                                                project.name ||
                                                "Unnamed Project"
                                            )}'
                                        )
                                    "
                                >

                                    🧟 Revive

                                </button>

                            `;

                        }

                        else if (
                            projectStatus ===
                            "revival-requested"
                        ) {

                            reviveButton = `

                                <button
                                    class="revive-btn"
                                    disabled
                                >

                                    ⏳ Request Pending

                                </button>

                            `;

                        }

                        else if (
                            projectStatus ===
                            "in-progress"
                        ) {

                            reviveButton = `

                                <button
                                    class="revive-btn"
                                    disabled
                                >

                                    🔨 In Progress

                                </button>

                            `;

                        }

                        else if (
                            projectStatus ===
                            "revived"
                        ) {

                            reviveButton = `

                                <button
                                    class="revive-btn"
                                    disabled
                                >

                                    ✨ Revived

                                </button>

                            `;

                        }


                        // =============================
                        // SAVED STATE
                        // =============================

                        const isSaved =
                            savedProjectIds.has(
                                projectDoc.id
                            );


                        const saveButtonText =
                            isSaved
                                ? "✅ Saved"
                                : "🔖 Save";


                        const saveButtonClass =
                            isSaved
                                ? "save-btn saved"
                                : "save-btn";


                        const saveButtonTitle =
                            isSaved
                                ? "Remove from saved projects"
                                : "Save Project";


                        // =============================
                        // CARD HTML
                        // =============================

                        card.innerHTML = `

                            <div class="tombstone">
                                ⚰️
                            </div>


                            <span class="status">

                                ${statusIcon}
                                ${statusText}

                            </span>


                            <div class="revival-score">

                                🔥
                                ${revivalScore}%
                                Revival Potential

                            </div>


                            <h2>

                                ${escapeHTML(
                                    project.name ||
                                    "Unnamed Project"
                                )}

                            </h2>


                            <p>

                                ${escapeHTML(
                                    project.description ||
                                    "No description provided."
                                )}

                            </p>


                            <!-- TECHNOLOGY -->

                            <div class="tech">

                                ${
                                    project.technology

                                        ? project.technology
                                            .split(",")
                                            .map(
                                                tech =>
                                                    `
                                                    <span>
                                                        ${escapeHTML(
                                                            tech.trim()
                                                        )}
                                                    </span>
                                                    `
                                            )
                                            .join("")

                                        : `
                                            <span>
                                                Not specified
                                            </span>
                                        `
                                }

                            </div>


                            <!-- NEW PROJECT TAGS -->

                            <div
                                class="project-tag-groups"
                            ></div>


                            <div class="cause">

                                <strong>
                                    Cause of death:
                                </strong>

                                ${escapeHTML(
                                    project.cause ||
                                    "Unknown"
                                )}

                            </div>


                            <div class="difficulty">

                                Difficulty:

                                ${
                                    "⭐".repeat(

                                        project.difficulty ===
                                        "easy"

                                            ? 1

                                            : project.difficulty ===
                                              "medium"

                                                ? 2

                                                : 3

                                    )
                                }

                            </div>


                            <div class="card-buttons">


                                <!-- VIEW PROJECT -->

                                <button
                                    class="view-btn"
                                    data-project-id="${projectDoc.id}"
                                >

                                    View Project

                                </button>


                                <!-- SAVE PROJECT -->

                                <button
                                    class="${saveButtonClass}"
                                    data-project-id="${projectDoc.id}"
                                    title="${saveButtonTitle}"
                                >

                                    ${saveButtonText}

                                </button>


                                <!-- REVIVE -->

                                ${reviveButton}

                            </div>

                        `;


                        projectGrid.appendChild(
                            card
                        );


                        // =============================
                        // RENDER TAGS
                        // =============================

                        renderProjectTags(
                            card.querySelector(
                                ".project-tag-groups"
                            ),
                            project.skills,
                            project.projectTypes
                        );


                        // =============================
                        // VIEW PROJECT
                        // =============================

                        card
                            .querySelector(
                                ".view-btn"
                            )
                            .addEventListener(
                                "click",
                                function() {

                                    window.location.href =
                                        `project-details.html?id=${projectDoc.id}`;

                                }
                            );


                        // =============================
                        // SAVE PROJECT
                        // =============================

                        card
                            .querySelector(
                                ".save-btn"
                            )
                            .addEventListener(
                                "click",
                                function() {

                                    toggleSaveProject(
                                        projectDoc.id,
                                        project.name ||
                                        "Unnamed Project",
                                        this
                                    );

                                }
                            );

                    }
                );

            }

            catch (error) {

                console.error(
                    "Error loading projects:",
                    error
                );


                projectGrid.innerHTML = `

                    <div class="no-projects">

                        <h2>
                            ❌ Unable to Load Projects
                        </h2>

                        <p>
                            Something went wrong while loading
                            the Project Graveyard.
                        </p>

                    </div>

                `;

            }

        }


        // =============================
        // SORT PROJECTS
        // =============================

        sortSelect.addEventListener(
            "change",
            function() {

                const cards =
                    Array.from(
                        projectGrid.querySelectorAll(
                            ".project-card"
                        )
                    );


                const sortType =
                    sortSelect.value;


                cards.sort(
                    function(a, b) {


                        // REVIVAL POTENTIAL

                        if (
                            sortType ===
                            "revival"
                        ) {

                            return (

                                Number(
                                    b.dataset.revivalScore
                                )

                                -

                                Number(
                                    a.dataset.revivalScore
                                )

                            );

                        }


                        // RECENTLY BURIED

                        if (
                            sortType ===
                            "recent"
                        ) {

                            return (

                                Number(
                                    b.dataset.createdTime
                                )

                                -

                                Number(
                                    a.dataset.createdTime
                                )

                            );

                        }


                        // EASIEST TO REVIVE

                        if (
                            sortType ===
                            "easy"
                        ) {

                            const starsA =
                                (
                                    a
                                        .querySelector(
                                            ".difficulty"
                                        )
                                        ?.textContent
                                        .match(
                                            /⭐/g
                                        )
                                    || []
                                ).length;


                            const starsB =
                                (
                                    b
                                        .querySelector(
                                            ".difficulty"
                                        )
                                        ?.textContent
                                        .match(
                                            /⭐/g
                                        )
                                    || []
                                ).length;


                            return (
                                starsA -
                                starsB
                            );

                        }


                        return 0;

                    }
                );


                cards.forEach(
                    function(card) {

                        projectGrid.appendChild(
                            card
                        );

                    }
                );

            }
        );


        // =============================
        // SECURITY HELPERS
        // =============================

        function escapeHTML(text) {

            return String(text)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function escapeJS(text) {

            return String(text)

                .replace(
                    /\\/g,
                    "\\\\"
                )

                .replace(
                    /'/g,
                    "\\'"
                )

                .replace(
                    /\n/g,
                    "\\n"
                )

                .replace(
                    /\r/g,
                    "\\r"
                );

        }


        // =============================
        // MAKE SAVE FUNCTION AVAILABLE
        // =============================

        window.toggleSaveProject =
            toggleSaveProject;


        // =============================
        // START
        // =============================

        onAuthStateChanged(
            auth,
            async function(user) {

                currentUser =
                    user;

                await loadProjects();

            }
        );

    </script>


    <!-- =============================
         AUTHENTICATION NAVIGATION
    ============================== -->

    <script type="module">

        import {
            auth
        } from "./firebase.js";


        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        const authLink =
            document.getElementById(
                "authLink"
            );


        onAuthStateChanged(
            auth,
            function(user) {

                if (user) {

                    authLink.textContent =
                        "👤 " +
                        (
                            user.displayName ||
                            "Account"
                        );

                    authLink.href =
                        "account.html";

                }

                else {

                    authLink.textContent =
                        "Login";

                    authLink.href =
                        "login.html";

                }

            }
        );

    </script>
